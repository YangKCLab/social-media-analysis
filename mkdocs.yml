site_name: Social Media Analysis
site_description: Course materials for social media analysis
site_author: Kaicheng Yang
repo_url: https://github.com/YangKCLab/social-media-analysis
repo_name: social-media-analysis
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocs-jupyter:
      execute: false                    # Don't run notebooks (outputs pre-committed)
      include_source: true              # Enable download links
      show_input: true                  # Show code cells
      theme: light                      # Notebook theme
      ignore_h1_titles: false          # Use notebook titles
  - open-in-new-tab:
      add_icon: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-VE0KJD22CN
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YangKCLab
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/yang3kc
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kaicheng-yang-43477213b/

# ToC
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Topics:
    - Introduction:
      - topics/introduction/index.md
    - Data Collection:
      - topics/data-collection/index.md
      - "Bluesky: Search posts": topics/data-collection/bluesky_search_posts.ipynb
      - "Bluesky: User profile": topics/data-collection/bluesky_get_user_profile.ipynb
      - "Bluesky: Followers": topics/data-collection/bluesky_get_followers.ipynb
      - "4chan: Boards": topics/data-collection/4chan_boards.ipynb
      - "4chan: Catalog": topics/data-collection/4chan_catalog.ipynb
      - "4chan: Thread": topics/data-collection/4chan_thread.ipynb
      - "4chan: Archive": topics/data-collection/4chan_archive.ipynb
      - "4chan: Collect a whole board": topics/data-collection/4chan_collect_board.ipynb
      - "YouTube: Search videos": topics/data-collection/youtube_search_videos.ipynb
      - "YouTube: Channel information": topics/data-collection/youtube_channel_information.ipynb
      - "YouTube: Video information": topics/data-collection/youtube_video_information.ipynb
      - "YouTube: Video comments": topics/data-collection/youtube_video_comments.ipynb
    - Data Format and Management:
      - topics/data-format-management/index.md
    - Measurements and Metrics:
      - topics/measurements/index.md
    - Hypothesis Testing and Statistical Analysis:
      - topics/stats/index.md
    - Visualization:
      - topics/visualization/index.md
    - Network Analysis:
      - topics/network/index.md
  - Materials:
    - Demos:
      - demos/index.md
    - Research Papers: papers.md
    - Project Assignment: project.md
    - Resources: resources.md
