site_name: Social Media Analysis
site_description: Course materials for social media analysis
site_author: Kaicheng Yang
repo_url: https://github.com/YangKCLab/social-media-analysis
repo_name: social-media-analysis
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocs-jupyter:
      execute: false                    # Don't run notebooks at build time; the site shows code only
      include_source: true              # Enable download links
      show_input: true                  # Show code cells
      theme: light                      # Notebook theme
      ignore_h1_titles: true            # Use the nav: label as the title of a notebook page, not its first heading
  - open-in-new-tab:
      add_icon: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

# Math in prose pages: arithmatex marks the formulas, MathJax renders them
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Data files that the measurement and stats notebooks download on a local run stay out of the built site
exclude_docs: |
  topics/measurements/data/
  topics/stats/data/
  topics/visualization/output/

extra:
  analytics:
    provider: google
    property: G-VE0KJD22CN
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YangKCLab
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/yang3kc
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kaicheng-yang-43477213b/

