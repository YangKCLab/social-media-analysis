[project]
name = "social-media-analysis"
version = "0.1.0"
description = "Course materials for social media analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "atproto>=0.0.71",
    "gensim>=4.4.0",
    "google-api-python-client>=2.199.0",
    "json-repair>=0.63.4",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "nltk>=3.10.3",
    "notebook>=7.6.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "ujson>=5.13.0",
    "vadersentiment>=3.3.2",
]

[project.optional-dependencies]
docs = []

[dependency-groups]
docs = [
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material>=9.7.0",
    "mkdocs-open-in-new-tab>=1.0.8",
]
ml = [
    "bertopic>=0.17.4",
    "detoxify>=0.5.2",
]

[tool.uv]
default-groups = ["docs"]
